# REVIEW ONLY. Not installed/reloaded. TLS/trusted proxy topology require approval.
events { worker_connections 1024; }
http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=web_requests:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_requests:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=connections:10m;
  limit_req_status 429;
  limit_conn_status 429;
  client_max_body_size 12m;
  client_header_timeout 10s;
  client_body_timeout 30s;
  send_timeout 30s;
  server {
    listen 8080;
    server_name localhost;
    limit_conn connections 20;
    location / {
      limit_req zone=web_requests burst=30 nodelay;
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }
    location /api/v1/ {
      limit_req zone=api_requests burst=10 nodelay;
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }
  }
}
