name: Verify application (no deployment)
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, official release verified
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Browser regressions (synthetic data only)
        env:
          VET_VAT_CHROME_PATH: /usr/bin/google-chrome
        run: |
          test -x "$VET_VAT_CHROME_PATH"
          node tests/browser-invoices.cjs --stage2 --stage3 --milestone1 --milestone2 --frontend --frontend-batch2
          node tests/browser-invoices.cjs --supplier-only
          node tests/browser-invoices.cjs --release-frontend-only
          node tests/browser-invoices.cjs --cleanup-only
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Validate approved container base
        env:
          NODE_IMAGE: ${{ vars.NODE_IMAGE }}
        run: |
          if [[ ! "$NODE_IMAGE" =~ ^node:22[.a-zA-Z0-9-]*@sha256:[a-f0-9]{64}$ ]]; then
            echo 'Configure a reviewed official Node 22 image digest in repository variable NODE_IMAGE.'
            exit 1
          fi
      - name: Build container locally (never push)
        env:
          NODE_IMAGE: ${{ vars.NODE_IMAGE }}
        run: docker build --build-arg "NODE_IMAGE=$NODE_IMAGE" --tag vetthevat:ci .
